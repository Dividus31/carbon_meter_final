name: Carbon-Meter CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci



      - name: Build API-Image
        run: docker build -t carbon-meter-api .

      - name: API start
        run: |
          docker run -d \
            --name carbon-meter-api \
            -p 3000:3000 \
            -e PORT=3000 \
            -e NODE_ENV=test \
            -e DATABASE_URL=postgresql://unused:unused@localhost:5432/unused \
            -e JWT_SECRET=ci-test-secret \
            -e CLIENT_ORIGIN=http://localhost:8080 \
            -e COOKIE_SECURE=false \
            carbon-meter-api

      - name: Wait for API to be ready
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs carbon-meter-api
          exit 1

      - name: Run automated tests
        run: npm test
        env:
          API_BASE_URL: http://localhost:3000

      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}